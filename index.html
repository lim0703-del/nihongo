<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>일본어 공부</title>
<meta name="theme-color" content="#263238">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="일본어 공부">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta charset="utf-8">
<style>
  :root { --bg:#f5f6fa; --card:#fff; --ink:#263238; --sub:#78909c; --line:#e0e4ea;
          --g1:#1e88e5; --g2:#43a047; --g3:#fb8c00; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Noto Sans KR','Noto Sans JP',sans-serif; background:var(--bg); color:var(--ink); }
  header { background:#263238; color:#fff; padding:18px 16px; }
  header h1 { margin:0; font-size:20px; }
  header p { margin:4px 0 0; font-size:13px; color:#b0bec5; }
  .wrap { max-width:1100px; margin:0 auto; padding:16px; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; }
  .tab, .mode { border:1px solid var(--line); background:#fff; padding:8px 14px; border-radius:20px; cursor:pointer; font-size:14px; }
  .tab.on { background:#263238; color:#fff; border-color:#263238; }
  .mode.on { background:#546e7a; color:#fff; border-color:#546e7a; }
  input[type=search] { flex:1; min-width:180px; padding:9px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px; }
  .rule { background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 16px; margin-bottom:14px; font-size:14px; line-height:1.7; }
  .rule b { color:#37474f; }
  .rule table { border-collapse:collapse; margin-top:6px; font-size:13px; }
  .rule td, .rule th { border:1px solid var(--line); padding:4px 10px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:12px; }
  .card { background:var(--card); border-radius:12px; border:1px solid var(--line); overflow:hidden; }
  .card .top { padding:12px 14px; border-left:6px solid var(--g1); }
  .card.g2 .top { border-color:var(--g2); } .card.g3 .top { border-color:var(--g3); }
  .verb { font-size:26px; font-weight:700; }
  .reading { color:var(--sub); font-size:14px; margin-left:6px; }
  .meaning { margin-top:2px; font-size:15px; }
  .badge { display:inline-block; font-size:11px; padding:2px 8px; border-radius:10px; background:#eceff1; margin-right:4px; }
  .card table { width:100%; border-collapse:collapse; font-size:14px; }
  .card td { padding:6px 10px; border-top:1px solid var(--line); vertical-align:middle; }
  .card td.lbl { color:var(--sub); font-size:12px; width:36%; }
  .jp { font-size:16px; } .kn { color:var(--sub); font-size:11px; display:block; } .ko { color:#5e35b1; font-size:13px; }
  .hl { background:#fff8e1; }
  .spk { border:none; background:none; cursor:pointer; font-size:16px; padding:0 4px; }
  .tbl-wrap { overflow:auto; background:#fff; border-radius:10px; border:1px solid var(--line); }
  table.big { border-collapse:collapse; font-size:13px; white-space:nowrap; }
  table.big th { position:sticky; top:0; background:#37474f; color:#fff; padding:8px; }
  table.big td { border-top:1px solid var(--line); padding:6px 8px; }
  table.big tr.g1 td:first-child { border-left:4px solid var(--g1); }
  table.big tr.g2 td:first-child { border-left:4px solid var(--g2); }
  table.big tr.g3 td:first-child { border-left:4px solid var(--g3); }
  .quiz { background:#fff; border-radius:14px; border:1px solid var(--line); padding:28px; text-align:center; max-width:560px; margin:0 auto; }
  .quiz .q { font-size:34px; font-weight:700; }
  .quiz .ask { margin:12px 0; font-size:17px; color:#5e35b1; }
  .quiz .ans { font-size:26px; min-height:70px; margin:12px 0; }
  .btn { background:#263238; color:#fff; border:none; padding:10px 20px; border-radius:8px; font-size:15px; cursor:pointer; margin:4px; }
  .btn.alt { background:#90a4ae; }
  .loading { text-align:center; padding:60px; color:var(--sub); }
  .count { color:var(--sub); font-size:13px; }
  /* 상단 메뉴 */
  .nav { display:flex; gap:6px; margin-top:12px; }
  .nav button { border:none; background:#37474f; color:#cfd8dc; padding:8px 16px; border-radius:8px; cursor:pointer; font-size:14px; }
  .nav button.on { background:#fff; color:#263238; font-weight:700; }
  .hidden { display:none !important; }
  /* 숫자 퀴즈 */
  .lv { border:1px solid var(--line); background:#fff; padding:8px 12px; border-radius:10px; cursor:pointer; font-size:13px; }
  .lv.on { background:#5e35b1; color:#fff; border-color:#5e35b1; }
  .numq { font-size:56px; font-weight:800; letter-spacing:1px; }
  .stats { display:flex; justify-content:center; gap:18px; font-size:13px; color:var(--sub); margin-bottom:14px; flex-wrap:wrap; }
  .stats b { color:var(--ink); font-size:16px; }
  .parts { display:flex; flex-wrap:wrap; justify-content:center; gap:6px; margin-top:8px; }
  .part { background:#ede7f6; border-radius:8px; padding:4px 10px; font-size:14px; }
  .part small { display:block; color:var(--sub); font-size:11px; }
  .part.irr { background:#ffe0b2; }
  .ansinput { font-size:20px; padding:10px; width:100%; max-width:320px; border:2px solid var(--line); border-radius:10px; text-align:center; }
  .ok { color:#2e7d32; font-weight:700; } .ng { color:#c62828; font-weight:700; }
  .timer { font-size:13px; color:var(--sub); }
  .ref { background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 16px; margin-top:16px; font-size:13px; overflow:auto; }
  .ref table { border-collapse:collapse; width:100%; }
  .ref td, .ref th { border:1px solid var(--line); padding:5px 8px; text-align:center; white-space:nowrap; }
  .ref .irr { background:#fff3e0; font-weight:700; }
  /* 음성 인식 */
  .mic { width:92px; height:92px; border-radius:50%; border:none; background:#5e35b1; color:#fff; font-size:38px; cursor:pointer; box-shadow:0 4px 14px rgba(94,53,177,.35); }
  .mic.rec { background:#e53935; animation:pulse 1s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(229,57,53,.5)} 100%{box-shadow:0 0 0 22px rgba(229,57,53,0)} }
  .heard { margin-top:10px; font-size:15px; color:var(--sub); min-height:22px; }
  .heard b { color:var(--ink); }
  .koq { font-size:32px; font-weight:800; line-height:1.3; }
  .opts { font-size:13px; color:var(--sub); margin-top:14px; }
  /* 📊 한눈에 보기 */
  .ovopts { font-size:13px; gap:12px; }
  .ovopts label { display:flex; align-items:center; gap:4px; cursor:pointer; }
  .end-demo { color:#e53935; font-weight:800; }
  .ov-sec { margin-bottom:26px; border-radius:14px; overflow:hidden; border:1px solid var(--line); background:#fff; }
  .ov-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; padding:14px 16px; color:#fff; }
  .g1 .ov-head { background:linear-gradient(135deg,#1e88e5,#1565c0); }
  .g2 .ov-head { background:linear-gradient(135deg,#43a047,#2e7d32); }
  .g3 .ov-head { background:linear-gradient(135deg,#fb8c00,#ef6c00); }
  .ov-head h2 { margin:0; font-size:20px; } .ov-head h2 small { font-size:13px; opacity:.85; font-weight:400; }
  .ov-head .desc { font-size:13px; opacity:.9; margin-top:2px; }
  .formula { display:flex; flex-direction:column; gap:4px; }
  .formula span { background:rgba(255,255,255,.18); border-radius:8px; padding:3px 10px; font-size:12.5px; }
  .ov-subh { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:10px 14px; background:#f7f9fc; border-top:1px solid var(--line); }
  .endbig { font-size:17px; font-weight:800; padding:2px 12px; border-radius:8px; color:#fff; }
  .g1 .endbig { background:var(--g1); } .g2 .endbig { background:var(--g2); } .g3 .endbig { background:var(--g3); }
  .rulechip { background:#fff; border:1px solid var(--line); border-radius:14px; padding:3px 10px; font-size:13px; font-weight:600; }
  .notechip { background:#fff3e0; color:#e65100; border-radius:14px; padding:3px 10px; font-size:12px; }
  .ov-wrap { overflow-x:auto; }
  table.ov { border-collapse:separate; border-spacing:0; width:100%; font-size:14px; }
  table.ov th { background:#eceff1; color:#455a64; font-size:11.5px; font-weight:700; padding:6px 10px; text-align:left; white-space:nowrap; border-bottom:2px solid var(--line); }
  table.ov th.pol { background:#e3f2fd; color:#1565c0; } table.ov th.cas { background:#fff3e0; color:#e65100; }
  table.ov th.hl, table.ov td.hl { background:#fff59d !important; }
  table.ov td { padding:8px 10px; border-bottom:1px solid #f0f2f5; white-space:nowrap; vertical-align:top; }
  table.ov tbody tr:hover td { background:#fffde7; }
  table.ov .sticky { position:sticky; left:0; z-index:1; background:#fff; border-right:2px solid var(--line); min-width:150px; }
  table.ov th.sticky { background:#eceff1; z-index:2; }
  .basewrap { display:flex; gap:8px; align-items:flex-start; }
  .cat { min-width:30px; text-align:center; font-weight:800; font-size:15px; border-radius:6px; padding:2px 6px; color:#fff; }
  .g1 .cat { background:var(--g1); } .g2 .cat { background:var(--g2); font-size:11px; } .g3 .cat { background:var(--g3); font-size:11px; }
  .bk { font-size:19px; font-weight:800; }
  .exc { font-size:10px; background:#ffe0b2; color:#e65100; border-radius:6px; padding:1px 5px; margin-left:2px; vertical-align:middle; }
  .bm { display:block; margin-top:3px; font-size:12.5px; font-weight:600; color:#37474f; white-space:normal; max-width:130px; }
  #verbApp { max-width:1400px; }
  .nav { overflow-x:auto; } .nav button { white-space:nowrap; flex:none; }
  @media (max-width:600px) { .nav button { padding:7px 10px; font-size:13px; } table.ov .sticky { min-width:120px; } .bk { font-size:17px; } }
  .fj { font-size:16px; }
  .g1 .end { color:#1565c0; font-weight:800; } .g2 .end { color:#2e7d32; font-weight:800; } .g3 .end { color:#ef6c00; font-weight:800; }
  .fc .end { color:#e53935 !important; }
  table.ov .rd { display:block; font-size:11px; color:var(--sub); }
  table.ov .pr { display:block; font-size:11px; color:#5e35b1; }
  table.ov .spk { font-size:13px; padding:0 2px; opacity:.6; }
  body.hide-rd table.ov .rd, body.hide-rd .card .kn { display:none; }
  body.hide-pr table.ov .pr { display:none; }
  body.hide-mean .bm, body.hide-mean .card .meaning { display:none; }
  /* 형태 칩 */
  .formbar { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:12px; }
  .fbl { font-size:13px; color:var(--sub); margin-right:2px; }
  .fchip { border:1.5px solid var(--line); background:#fff; border-radius:18px; padding:5px 11px; font-size:13px; cursor:pointer; }
  .fchip span { color:var(--sub); font-size:12px; }
  .fchip.pol { border-color:#90caf9; } .fchip.cas { border-color:#ffcc80; }
  .fchip.on { background:#263238; color:#fff; border-color:#263238; } .fchip.on span { color:#cfd8dc; }
  /* 표 머리글 두 줄 */
  table.ov th b { display:block; font-size:12.5px; } table.ov th span { font-weight:500; font-size:11.5px; }
  table.ov td.fc { cursor:pointer; padding:7px 8px; }
  table.ov td.fc:active { background:#ede7f6; }
  .fj { font-size:15.5px; }
  /* 규칙 한눈에 */
  .rulebox { background:#fff; border:1px solid var(--line); border-radius:14px; margin-bottom:20px; overflow:hidden; }
  .rulebox summary { cursor:pointer; padding:12px 16px; font-weight:800; font-size:16px; background:#263238; color:#fff; }
  .rulebox summary small { font-weight:400; opacity:.75; font-size:12px; }
  table.rc td, table.rc th { white-space:nowrap; }
  table.rc th.rg1 { background:#e3f2fd; color:#1565c0; } table.rc th.rg2 { background:#e8f5e9; color:#2e7d32; } table.rc th.rg3 { background:#fff3e0; color:#ef6c00; }
  table.rc th b { display:inline; font-size:14px; color:var(--ink); }
  .polc { background:#e3f2fd; color:#1565c0; } .casc { background:#fff3e0; color:#e65100; }
  .polc b, .casc b { font-size:13.5px; } .fend { font-size:13px; font-weight:700; }
  .kmean { font-size:13px; color:#37474f; }
  .hlrow td { background:#fff59d !important; }
  .rulefoot { font-size:12px; color:var(--sub); padding:8px 14px; border-top:1px solid var(--line); }
  table.rc .end { color:#e53935; font-weight:800; }
  table.rc .pr { display:block; font-size:11px; color:#5e35b1; }
  /* 휴대폰: 동사 하나 = 카드 한 장, 7가지 형태를 2칸 격자로 */
  @media (max-width:760px) {
    table.ov:not(.rc) thead { display:none; }
    table.ov:not(.rc), table.ov:not(.rc) tbody { display:block; }
    table.ov:not(.rc) tr { display:grid; grid-template-columns:1fr 1fr; border-bottom:6px solid #f5f6fa; }
    table.ov:not(.rc) td { white-space:normal; border-bottom:1px solid #f0f2f5; }
    table.ov:not(.rc) td.sticky { grid-column:1 / -1; position:static; border-right:none; background:#fafbfc; }
    table.ov:not(.rc) td.fc::before { content:attr(data-label); display:block; font-size:10.5px; font-weight:700; color:#78909c; margin-bottom:1px; }
    table.ov:not(.rc) td.fc.pol::before { color:#1565c0; } table.ov:not(.rc) td.fc.cas::before { color:#e65100; }
    table.ov:not(.rc) td.fc:nth-child(2) { grid-column:1 / -1; }
    .bm { max-width:none; }
    .rulebox summary { font-size:15px; }
  }
  /* 여행 일본어 */
  .dayh { font-size:16px; font-weight:800; margin:18px 0 8px; color:#b3364a; }
  .tlist { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:10px; }
  .titem { background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .titem .tj { font-size:20px; font-weight:700; }
  .titem .tk { font-size:13px; color:var(--sub); }
  .titem .th { font-size:15px; color:#5e35b1; font-weight:600; }
  .titem .tm { font-size:13px; margin-top:2px; }
  .titem .tm b { font-size:15px; }
  .tacts { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .sbtn { border:1px solid var(--line); background:#f5f6fa; border-radius:8px; padding:4px 10px; font-size:12.5px; cursor:pointer; }
  .sbtn.rec { background:#e53935; color:#fff; border-color:#e53935; }
  .say { font-size:13px; margin-top:6px; color:var(--sub); }
  .taxi { margin-top:8px; background:#fff8e1; border-radius:8px; padding:8px 10px; font-size:14px; }
  .taxi div + div { margin-top:6px; padding-top:6px; border-top:1px dashed #ffe082; }
  .chipc { border:1px solid var(--line); background:#fff; padding:6px 12px; border-radius:16px; cursor:pointer; font-size:13px; }
  .chipc.on { background:#b3364a; color:#fff; border-color:#b3364a; }
  .bigshow { position:fixed; inset:0; background:#fff; z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center; cursor:pointer; }
  .bigjp { font-size:clamp(34px,9vw,72px); font-weight:800; line-height:1.3; }
  .bigkana { font-size:22px; color:var(--sub); margin-top:14px; }
  .bigko { font-size:20px; color:#5e35b1; margin-top:6px; }
  .bighint { position:absolute; bottom:24px; font-size:13px; color:var(--sub); }
</style>
</head>
<body>
<header style="padding-top:calc(18px + env(safe-area-inset-top))">
  <h1>🇯🇵 일본어 동사 활용 학습</h1>
  <p>동사 102개 활용 · 숫자 1~99,999 퀴즈 — 🔊 버튼으로 일본어 발음 듣기</p>
  <div class="nav">
    <button class="on" data-app="verbApp">📘 동사 활용</button>
    <button data-app="numApp">🔢 숫자 퀴즈</button>
    <button data-app="travelApp">✈️ 여행 일본어</button>
  </div>
</header>

<!-- ───────── 여행 일본어 ───────── -->
<div class="wrap hidden" id="travelApp">
  <div class="bar" id="tmodes">
    <button class="mode on" data-tm="places">📍 내 여행 장소</button>
    <button class="mode" data-tm="phrases">💬 필수 표현 200</button>
    <button class="mode" data-tm="quiz">🎤 표현 말하기 퀴즈</button>
  </div>
  <div class="bar" id="tfilter"></div>
  <div id="tview"><div class="loading">불러오는 중…</div></div>
</div>

<div class="bigshow hidden" id="bigshow" onclick="this.classList.add('hidden')">
  <div class="bigjp" id="bigjp"></div>
  <div class="bigkana" id="bigkana"></div>
  <div class="bigko" id="bigko"></div>
  <div class="bighint">화면을 누르면 닫혀요</div>
</div>

<!-- ───────── 숫자 퀴즈 ───────── -->
<div class="wrap hidden" id="numApp">
  <div class="bar" id="levels">
    <button class="lv on" data-lv="1">1단계 · 1~10</button>
    <button class="lv" data-lv="2">2단계 · 11~99</button>
    <button class="lv" data-lv="3">3단계 · 100~999</button>
    <button class="lv" data-lv="4">4단계 · 1,000~9,999</button>
    <button class="lv" data-lv="5">5단계 · 10,000~99,999</button>
    <button class="lv" data-lv="6">전체 · 1~99,999</button>
  </div>
  <div class="bar" id="nmodes">
    <button class="mode on" data-nm="read">숫자 보고 읽기</button>
    <button class="mode" data-nm="listen">듣고 숫자 쓰기</button>
    <button class="mode" data-nm="speak">🎤 말해서 맞히기</button>
    <label style="font-size:13px;margin-left:8px">
      <input type="checkbox" id="seq" checked> 순서대로 (1단계는 1부터)
    </label>
  </div>

  <div class="quiz">
    <div class="stats">
      <span>맞힘 <b id="sOk">0</b></span>
      <span>틀림 <b id="sNg">0</b></span>
      <span>연속 <b id="sStreak">0</b></span>
      <span>평균 <b id="sAvg">-</b>초</span>
    </div>
    <div id="numBox"></div>
    <div style="margin-top:14px">
      <button class="btn alt" onclick="retryWrong()">틀린 숫자만 다시 (<span id="wrongCnt">0</span>)</button>
      <button class="btn alt" onclick="resetNum()">점수 초기화</button>
    </div>
  </div>

  <div class="ref" id="numRef"></div>
</div>

<!-- ───────── 동사 활용 ───────── -->
<div class="wrap" id="verbApp">
  <div class="bar" id="tabs">
    <button class="tab on" data-g="0">전체</button>
    <button class="tab" data-g="1">1그룹</button>
    <button class="tab" data-g="2">2그룹</button>
    <button class="tab" data-g="3">3그룹</button>
    <input type="search" id="q" placeholder="검색 (한자, 히라가나, 뜻)">
  </div>
  <div class="bar" id="modes">
    <button class="mode on" data-m="table">📊 한눈에 보기</button>
    <button class="mode" data-m="card">🃏 카드 보기</button>
    <button class="mode" data-m="quiz">퀴즈</button>
    <button class="mode" data-m="speak">🎤 말하기 퀴즈</button>
    <span class="count" id="count"></span>
  </div>
  <div class="formbar" id="formbar"></div>

  <div class="bar ovopts" id="ovopts">
    <span style="font-size:13px;color:var(--sub)">표시:</span>
    <label><input type="checkbox" id="optRd" checked> 히라가나 읽기</label>
    <label><input type="checkbox" id="optPr" checked> 한글 발음</label>
    <label><input type="checkbox" id="optMean" checked> 뜻</label>
    <span style="font-size:12px;color:var(--sub)">· <span class="end-demo">색 글자</span> = 바뀌는 부분</span>
  </div>
  <div class="rule" id="rule"></div>
  <div id="view"><div class="loading">불러오는 중…</div></div>
</div>

,"ko":"사이후 오 나쿠시마시타","mean":"지갑을 잃어버렸어요"},{"cat":"긴급·건강","jp":"パスポートをなくしました","kana":"ぱすぽーと を なくしました","ko":"파스포-토 오 나쿠시마시타","mean":"여권을 잃어버렸어요"},{"cat":"긴급·건강","jp":"交番はどこですか","kana":"こうばん は どこ ですか","ko":"코-반 와 도코 데스카","mean":"파출소는 어디예요?"},{"cat":"긴급·건강","jp":"韓国大使館に連絡したいです","kana":"かんこく たいしかん に れんらく したい です","ko":"칸코쿠 타이시칸 니 렌라쿠 시타이 데스","mean":"한국 대사관에 연락하고 싶어요"}]}};
window.google = { script: { run: (function () {

  const api = {

    getVerbs() { const f = ok; setTimeout(() => f(APP_DATA.verbs)); },
    getTravel() { const f = ok; setTimeout(() => f(APP_DATA.travel)); }
  };
  return api;

</script>
<script>
const LABELS = {
  te:'연결형 (~て)', masu:'정중형 (~ます)', masen:'부정 정중 (~ません)', mashita:'과거 정중 (~ました)',
  masendeshita:'과거 정중 부정 (~ませんでした)', ta:'반말 과거 (~た)', nakatta:'반말 과거부정 (~なかった)'
};
const KEYS = Object.keys(LABELS);

const RULES = {
  0: `<b>동사 그룹 구분법</b><br>
      · <b>3그룹</b>: する(하다), 来る(오다) 단 2개 — 통째로 외우기<br>
      · <b>2그룹</b>: 「い단/え단 + る」로 끝남 → る를 떼고 ます・て・た・なかった를 붙임<br>
      · <b>1그룹</b>: 나머지 전부 (る로 끝나도 앞이 あ・う・お단이면 1그룹, 帰る・入る・走る・知る・切る・要る는 예외적으로 1그룹)`,
  1: `<b>1그룹 규칙</b> — ます형: 어미를 い단으로 (買う→買います) / なかった: 어미를 あ단으로 (う는 わ: 買わなかった)
      <table><tr><th>어미</th><th>て형 / た형</th><th>예</th></tr>
      <tr><td>う・つ・る</td><td>って / った</td><td>買って・待って・取って</td></tr>
      <tr><td>く</td><td>いて / いた</td><td>書いて (예외: 行く→行って)</td></tr>
      <tr><td>ぐ</td><td>いで / いだ</td><td>泳いで</td></tr>
      <tr><td>ぬ・ぶ・む</td><td>んで / んだ</td><td>死んで・遊んで・飲んで</td></tr>
      <tr><td>す</td><td>して / した</td><td>話して</td></tr></table>`,
  2: `<b>2그룹 규칙</b> — る를 떼고 붙이기만 하면 끝!<br>
      食べる → 食べて / 食べます / 食べません / 食べました / 食べませんでした / 食べた / 食べなかった`,
  3: `<b>3그룹 (불규칙)</b><br>
      する → して・します・しません・しました・しませんでした・した・しなかった<br>
      来る(くる) → 来て(きて)・来ます(きます)・来ました(きました)・来た(きた)・<b>来なかった(こなかった)</b> ← 부정만 こ!`
};

let VERBS = [], group = 0, mode = 'table', query = '', focus = '';

// 7가지 형태: [이름, 어미, 한국어 뜻]
const FORM_INFO = {
  te: ['연결형', '~て', '~하고 / ~해서'], masu: ['정중형', '~ます', '~합니다'], masen: ['부정 정중형', '~ません', '~하지 않습니다'],
  mashita: ['과거 정중형', '~ました', '~했습니다'], masendeshita: ['과거 부정 정중형', '~ませんでした', '~하지 않았습니다'],
  ta: ['반말 과거형', '~た', '~했다'], nakatta: ['반말 과거 부정형', '~なかった', '~하지 않았다']
};
function renderFormBar() {
  const bar = document.getElementById('formbar');
  bar.innerHTML = `<span class="fbl">형태 강조 · 연습:</span>
    <button class="fchip ${!focus ? 'on' : ''}" data-f="">전체</button>` +
    KEYS.map(k => `<button class="fchip ${POLITE.includes(k) ? 'pol' : 'cas'} ${focus === k ? 'on' : ''}" data-f="${k}">
      <b>${FORM_INFO[k][0]}</b> <span>${FORM_INFO[k][1]}</span></button>`).join('');
}
document.getElementById('formbar').addEventListener('click', e => {
  const b = e.target.closest('[data-f]'); if (!b) return;
  focus = focus === b.dataset.f ? '' : b.dataset.f; render();
});
// 표·카드 칸을 누르면 발음 듣기
document.addEventListener('click', e => {
  const c = e.target.closest('[data-say]');
  if (c && !e.target.closest('.spk')) speak(c.dataset.say);
});

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function speak(text) {
  if (!window.speechSynthesis) { alert('이 브라우저는 음성 재생을 지원하지 않아요.'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP'; u.rate = 0.85;
  const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('ja'));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
const spk = kana => `<button class="spk" onclick="speak('${esc(kana)}')" title="발음 듣기">🔊</button>`;

function filtered() {
  const q = query.trim().toLowerCase();
  return VERBS.filter(v => (!group || v.group === group) &&
    (!q || [v.kanji, v.kana, v.meaning, v.ko].some(x => String(x).toLowerCase().includes(q))));
}

function render() {
  stopListen();
  document.getElementById('rule').innerHTML = RULES[group];
  document.getElementById('rule').classList.toggle('hidden', mode === 'table');   // 한눈에 보기는 규칙이 표 안에 있음
  document.getElementById('ovopts').classList.toggle('hidden', mode !== 'table' && mode !== 'card');
  renderFormBar();
  const list = filtered();
  document.getElementById('count').textContent = list.length + '개';
  const view = document.getElementById('view');
  if (mode === 'card') view.innerHTML = renderCards(list);
  else if (mode === 'table') view.innerHTML = renderTable(list);
  else if (mode === 'speak') renderSpeak(list);
  else renderQuiz(list);
}

function renderCards(list) {
  return '<div class="grid">' + list.map(v => `
    <div class="card g${v.group}">
      <div class="top">
        <span class="badge">${v.group}그룹</span><span class="badge">${esc(v.cat)}</span><br>
        <span class="verb">${esc(v.kanji)}</span><span class="reading">${esc(v.kana)} · ${esc(v.ko)}</span>${spk(v.kana)}
        <div class="meaning">${esc(v.meaning)}</div>
      </div>
      <table>${KEYS.map(k => `

              <span class="kn">${esc(v.forms[k].kana)} · <span class="ko">${esc(v.forms[k].ko)}</span></span></td>

// 그룹 → 어미 묶음 (て형 규칙이 같은 것끼리)
const OV_GROUPS = {
  1: { title: '1그룹 동사', sub: '5단 동사 · 어미가 바뀌어요',
       formula: ['ます형: 어미 → い단 + ます (買う→買います)', 'なかった: 어미 → あ단 + なかった (う는 わ: 買わなかった)'],
       subs: [
         { t: 'う・つ・る', cats: ['う', 'つ', 'る', 'る (예외)'], rule: 'う・つ・る → って / った', note: '帰る・入る・走る・知る・切る・要る는 2그룹처럼 생겼지만 1그룹 (예외)' },
         { t: 'く・ぐ', cats: ['く', 'く (특수)', 'ぐ'], rule: 'く → いて / いた · ぐ → いで / いだ', note: '예외: 行く → 行って・行った' },
         { t: 'ぬ・ぶ・む', cats: ['ぬ', 'ぶ', 'む'], rule: 'ぬ・ぶ・む → んで / んだ' },
         { t: 'す', cats: ['す'], rule: 'す → して / した' } ] },
  2: { title: '2그룹 동사', sub: '1단 동사 · る만 떼면 끝',
       formula: ['모든 형태: る를 떼고 て・ます・ません・ました・ませんでした・た・なかった를 붙임'],
       subs: [
         { t: 'い단 + る', cats: ['い단+る'], rule: 'る → て / ます / た …' },
         { t: 'え단 + る', cats: ['え단+る'], rule: 'る → て / ます / た …' } ] },
  3: { title: '3그룹 동사', sub: '불규칙 · 통째로 외우기',
       formula: ['する → し + て/ます/た/なかった', '来る(くる) → き + て/ます/た · 부정만 こ + なかった'],
       subs: [ { t: 'する・来る', cats: ['불규칙'], rule: '불규칙 활용', note: '来なかった는 「こなかった」로 읽어요!' } ] }
};
const POLITE = ['masu', 'masen', 'mashita', 'masendeshita'];
const SHORT_LABEL = { te: '~て 연결형', masu: '~ます 정중', masen: '~ません 부정 정중', mashita: '~ました 과거 정중',
                      masendeshita: '~ませんでした 과거 정중 부정', ta: '~た 반말 과거', nakatta: '~なかった 반말 과거부정' };

// 기본형과 같은 앞부분(어간)과 바뀐 끝부분으로 나누기
function splitStem(base, jp) {
  let i = 0; const lim = Math.max(0, base.length - 1);
  while (i < lim && base[i] === jp[i]) i++;
  return [jp.slice(0, i), jp.slice(i)];
}
function formCell(v, k) {
  const f = v.forms[k], [stem, end] = splitStem(v.kanji, f.jp);
  return `<td class="fc ${POLITE.includes(k) ? 'pol' : 'cas'} ${focus === k ? 'hl' : ''}" data-say="${esc(f.kana)}"
    data-label="${FORM_INFO[k][0]} ${FORM_INFO[k][1]}" title="눌러서 발음 듣기">
    <span class="fj">${esc(stem)}<span class="end">${esc(end)}</span></span>
    <span class="rd">${esc(f.kana)}</span><span class="pr">${esc(f.ko)}</span></td>`;
}

function ruleChart() {
  const ex = [['買う', '1그룹', 1], ['飲む', '1그룹', 1], ['食べる', '2그룹', 2], ['する', '3그룹', 3], ['来る', '3그룹', 3]]
    .map(([k, l, g]) => ({ v: VERBS.find(v => v.kanji === k), l, g })).filter(x => x.v);
  if (!ex.length) return '';
  const cell = (v, k) => { const f = v.forms[k], [s, e] = splitStem(v.kanji, f.jp);
    return `<td class="fc" data-say="${esc(f.kana)}"><span class="fj">${esc(s)}<span class="end">${esc(e)}</span></span><span class="pr">${esc(f.ko)}</span></td>`; };
  return `<details class="rulebox" open><summary>📋 활용 규칙 한눈에 보기 <small>(칸을 누르면 발음)</small></summary>
    <div class="ov-wrap"><table class="ov rc">
      <thead><tr><th>형태</th><th>뜻</th>${ex.map(x => `<th class="rg${x.g}">${x.l}<br><b>${esc(x.v.kanji)}</b> ${esc(x.v.meaning)}</th>`).join('')}</tr></thead>
      <tbody>${KEYS.map(k => `<tr class="${focus === k ? 'hlrow' : ''}">
        <td class="${POLITE.includes(k) ? 'polc' : 'casc'}"><b>${FORM_INFO[k][0]}</b><br><span class="fend">${FORM_INFO[k][1]}</span></td>
        <td class="kmean">${FORM_INFO[k][2]}</td>
        ${ex.map(x => cell(x.v, k)).join('')}</tr>`).join('')}</tbody>
    </table></div>
    <div class="rulefoot">🔵 정중형(존댓말, ~ます 계열) · 🟠 반말 · <span class="end-demo">빨간 글자</span> = 바뀌는 부분</div>
  </details>`;
}

function renderTable(list) {
  const groups = group ? [group] : [1, 2, 3];
  let html = query.trim() ? '' : ruleChart();
  groups.forEach(g => {
    const G = OV_GROUPS[g], inG = list.filter(v => v.group === g);
    if (!inG.length) return;
    const used = new Set();
    const subs = G.subs.map(s => ({ ...s, verbs: inG.filter(v => s.cats.includes(v.cat) && used.add(v)) }));
    const rest = inG.filter(v => !used.has(v));
    if (rest.length) subs.push({ t: '기타', rule: '', verbs: rest });

    html += `<section class="ov-sec g${g}">
      <div class="ov-head">
        <div><h2>${G.title} <small>${inG.length}개</small></h2><div class="desc">${G.sub}</div></div>
        <div class="formula">${G.formula.map(f => `<span>${esc(f)}</span>`).join('')}</div>
      </div>`;
    subs.filter(s => s.verbs.length).forEach(s => {
      html += `<div class="ov-subh"><span class="endbig">${esc(s.t)}</span>
          ${s.rule ? `<span class="rulechip">て/た형: ${esc(s.rule)}</span>` : ''}
          ${s.note ? `<span class="notechip">⚠ ${esc(s.note)}</span>` : ''}</div>
        <div class="ov-wrap"><table class="ov">
          <thead><tr>
            <th class="sticky">어미 · 기본형 · 뜻</th>
            ${KEYS.map(k => `<th class="${POLITE.includes(k) ? 'pol' : 'cas'} ${focus === k ? 'hl' : ''}"><b>${FORM_INFO[k][0]}</b><span>${FORM_INFO[k][1]}</span></th>`).join('')}
          </tr></thead><tbody>
          ${s.verbs.map(v => `<tr>
            <td class="sticky">
              <div class="basewrap"><span class="cat">${esc(v.cat.replace(' (예외)', '').replace(' (특수)', ''))}</span>
              <div><span class="bk">${esc(v.kanji)}</span>${spk(v.kana)}
                ${/예외|특수/.test(v.cat) ? `<span class="exc">${/예외/.test(v.cat) ? '예외' : '특수'}</span>` : ''}
                <span class="rd">${esc(v.kana)}</span><span class="pr">${esc(v.ko)}</span>

            </td>
            ${KEYS.map(k => formCell(v, k)).join('')}
          </tr>`).join('')}
          </tbody></table></div>`;
    });
    html += '</section>';
  });
  return html || '<div class="loading">해당하는 동사가 없어요.</div>';
}

/* ═════════════ 음성 인식 (공통) ═════════════ */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, micReady = false, spAutoNext = true, spAutoMic = true;

function stopListen() {
  if (rec) { try { rec.onend = null; rec.onresult = null; rec.onerror = null; rec.abort(); } catch (e) {} }
  rec = null;
  document.querySelectorAll('.mic.rec').forEach(b => b.classList.remove('rec'));
}

/** 일본어 음성 인식 시작 → onAlts(후보 문자열 배열) */
function startListen(onAlts, statusEl, btn) {
  if (!SR) { statusEl.innerHTML = '⚠ 이 브라우저는 음성 인식을 지원하지 않아요. <b>Chrome</b>(PC·안드로이드)이나 아이폰 Safari에서 열어 주세요.'; return; }
  stopListen();
  const r = new SR();
  r.lang = 'ja-JP'; r.interimResults = true; r.maxAlternatives = 5; r.continuous = false;
  let got = false, errored = false;
  r.onresult = e => {
    const res = e.results[e.results.length - 1];
    const alts = [...res].map(a => a.transcript.trim()).filter(Boolean);
    if (res.isFinal) { got = true; micReady = true; onAlts(alts); }
    else statusEl.innerHTML = '🎙 듣는 중… <b>' + esc(alts[0] || '') + '</b>';
  };
  r.onerror = e => {
    errored = true;
    const msg = {
      'not-allowed': '마이크 권한이 막혀 있어요. 주소창의 🔒(또는 ⚙) → 마이크 "허용" 후 새로고침하세요.',
      'service-not-allowed': '마이크 권한이 막혀 있어요. 브라우저 설정에서 마이크를 허용해 주세요.',
      'no-speech': '소리가 안 들렸어요. 🎤를 누르고 다시 말해 보세요.',
      'audio-capture': '마이크를 찾을 수 없어요.',
      'network': '음성 인식 서버에 연결하지 못했어요. 인터넷 연결을 확인하세요.',
      'aborted': ''
    }[e.error];
    if (msg !== '') statusEl.innerHTML = '⚠ ' + (msg || '음성 인식 오류: ' + esc(e.error));
  };
  r.onend = () => {
    btn && btn.classList.remove('rec');
    if (!got && !errored) statusEl.innerHTML = '말이 인식되지 않았어요. 🎤를 누르고 다시 말해 보세요.';
    rec = null;
  };
  try {
    r.start(); rec = r;
    btn && btn.classList.add('rec');
    statusEl.innerHTML = '🎙 듣는 중… 일본어로 말하세요';
  } catch (err) { statusEl.innerHTML = '⚠ ' + esc(err.message); }
}

const norm = s => toHira(String(s)).replace(/[。、！？!?.．\s「」]/g, '');

/* ─── 동사 말하기 퀴즈 ─── */
let spq = null, spShowJp = false, spSt = { ok: 0, ng: 0, streak: 0 };

/** 인식 결과가 정답인지 (뜻이 같은 다른 동사도 인정: 言う/話す 등) */
function verbMatch(alts, v, k) {
  const cands = VERBS.filter(x => x === v || (x.koForms && v.koForms && x.koForms.base === v.koForms.base));
  const A = alts.map(norm);
  for (const a of A) for (const x of cands) {
    const f = x.forms[k];
    if (a === norm(f.jp) || a === norm(f.kana)) return { ok: true, x };
  }
  // 발음은 같은데 다른 한자로 인식된 경우 (예: 取りました → 撮りました)
  const f = v.forms[k], tail = (f.jp.match(/[ぁ-ゖ]+$/) || [''])[0];
  for (const a of A) {
    if (tail && a.endsWith(tail) && a.length === norm(f.jp).length && /[一-鿿]/.test(a)) return { ok: true, x: v, homo: true };
  }
  return { ok: false };
}

function renderSpeak(list) {
  stopListen();
  const view = document.getElementById('view');
  const pool = list.filter(v => v.koForms);
  if (!pool.length) { view.innerHTML = '<div class="loading">해당하는 동사가 없어요.</div>'; return; }
  const v = pool[Math.floor(Math.random() * pool.length)];
  const k = focus || KEYS[Math.floor(Math.random() * KEYS.length)];
  spq = { v, k, start: Date.now(), done: false, failed: false };
  view.innerHTML = `<div class="quiz">
      <div class="stats">
        <span>맞힘 <b>${spSt.ok}</b></span><span>틀림 <b>${spSt.ng}</b></span><span>연속 <b>${spSt.streak}</b></span>
      </div>
      <span class="badge">${LABELS[k]}</span>
      <div class="koq" style="margin-top:8px">${esc(v.koForms[k])}</div>
      <div style="color:var(--sub);margin-top:6px">기본형: ${esc(v.koForms.base)}
        <span id="jpHint" class="${spShowJp ? '' : 'hidden'}"> → ${esc(v.kanji)} (${esc(v.kana)})</span>
        <a href="#" onclick="spShowJp=!spShowJp;document.getElementById('jpHint').classList.toggle('hidden');return false" style="font-size:12px">[일본어 힌트]</a>
      </div>
      <div style="margin:20px 0 6px"><button class="mic" id="micBtn" onclick="speakTry()">🎤</button></div>
      <div class="heard" id="heard">🎤를 누르고 일본어로 말하세요 (스페이스바도 가능)</div>
      <div id="spAns" class="ans" style="font-size:22px"></div>
      <div>
        <button class="btn alt" onclick="spReveal()">정답 보기</button>
        <button class="btn alt" onclick="render()">다음 ▶</button>
      </div>
      <div class="opts">
        <label><input type="checkbox" ${spAutoNext ? 'checked' : ''} onchange="spAutoNext=this.checked"> 정답이면 자동으로 다음</label> ·
        <label><input type="checkbox" ${spAutoMic ? 'checked' : ''} onchange="spAutoMic=this.checked"> 문제가 나오면 바로 듣기</label><br>
        위의 '형태' 버튼을 누르면 그 형태만 나와요 (예: 과거 부정 정중형)
      </div>
    </div>`;
  if (spAutoMic && micReady) setTimeout(() => { if (spq && spq.v === v && !spq.done) speakTry(); }, 400);
}

function speakTry() {
  if (!spq || spq.done) return;
  startListen(judgeSpeak, document.getElementById('heard'), document.getElementById('micBtn'));
}

function formAnswerHtml(f) {
  return `${esc(f.jp)} ${spk(f.kana)}<br><span style="font-size:15px;color:var(--sub)">${esc(f.kana)} · <span class="ko">${esc(f.ko)}</span></span>`;
}

function judgeSpeak(alts) {
  const sec = ((Date.now() - spq.start) / 1000).toFixed(1);
  const r = verbMatch(alts, spq.v, spq.k);
  document.getElementById('heard').innerHTML = '인식된 말: <b>' + esc(alts[0] || '') + '</b>' +
    (alts.length > 1 ? ` <small>(후보: ${alts.slice(1, 3).map(esc).join(', ')})</small>` : '');
  const ans = document.getElementById('spAns');
  if (r.ok) {
    spq.done = true;
    if (!spq.failed) { spSt.ok++; spSt.streak++; }
    const extra = r.x !== spq.v ? `<div class="count">(${esc(r.x.kanji)}도 같은 뜻이라 정답!)</div>` : '';
    ans.innerHTML = `<div class="ok">⭕ 정답! <span class="timer">${sec}초</span></div>${formAnswerHtml(r.x.forms[spq.k])}${extra}`;
    if (spAutoNext) { const cur = spq; setTimeout(() => { if (mode === 'speak' && spq === cur) render(); }, 1400); }
  } else {
    if (!spq.failed) { spq.failed = true; spSt.ng++; spSt.streak = 0; }
    ans.innerHTML = `<div class="ng">❌ 다시 말해 보세요</div>
      <button class="btn alt" style="font-size:13px" onclick="speakTry()">🎤 다시 말하기</button>
      <button class="btn alt" style="font-size:13px" onclick="spOverride()">맞게 말했어요 (인식 오류)</button>`;
  }
}

function spOverride() {
  if (!spq) return;
  spq.done = true;
  if (spq.failed) { spSt.ng--; spq.failed = false; }
  spSt.ok++; spSt.streak++;
  render();
}

function spReveal() {
  if (!spq) return;
  stopListen();
  if (!spq.done && !spq.failed) { spSt.ng++; spSt.streak = 0; spq.failed = true; }
  const f = spq.v.forms[spq.k];
  document.getElementById('spAns').innerHTML = formAnswerHtml(f) +
    `<div><button class="btn alt" style="font-size:13px" onclick="speakTry()">🎤 따라 말해 보기</button></div>`;
  speak(f.kana);
}

const D1  = ['', 'いち', 'に', 'さん', 'よん', 'ご', 'ろく', 'なな', 'はち', 'きゅう'];
const HUN = ['', 'ひゃく', 'にひゃく', 'さんびゃく', 'よんひゃく', 'ごひゃく', 'ろっぴゃく', 'ななひゃく', 'はっぴゃく', 'きゅうひゃく'];
const THO = ['', 'せん', 'にせん', 'さんぜん', 'よんせん', 'ごせん', 'ろくせん', 'ななせん', 'はっせん', 'きゅうせん'];
const IRR = ['さんびゃく', 'ろっぴゃく', 'はっぴゃく', 'さんぜん', 'はっせん'];  // 소리가 바뀌는 것

/** 숫자 → 자리별 조각 [{kana, label}] */
function numParts(n) {
  const p = [];
  const man = Math.floor(n / 10000), th = Math.floor(n / 1000) % 10,
        hu = Math.floor(n / 100) % 10, te = Math.floor(n / 10) % 10, on = n % 10;
  if (man) p.push({ kana: D1[man] + 'まん', label: (man * 10000).toLocaleString() });
  if (th)  p.push({ kana: THO[th], label: (th * 1000).toLocaleString() });
  if (hu)  p.push({ kana: HUN[hu], label: String(hu * 100) });
  if (te)  p.push({ kana: (te === 1 ? '' : D1[te]) + 'じゅう', label: String(te * 10) });
  if (on)  p.push({ kana: D1[on], label: String(on) });
  return p;
}
const numKana = n => numParts(n).map(p => p.kana).join('');

/** 입력 정답으로 인정할 표기 (4=し, 7=しち, 9=く 등) */
function numAccepts(n) {
  const base = numKana(n), set = new Set([base]);
  const on = n % 10, te = Math.floor(n / 10) % 10;
  const alt = { 4: 'し', 7: 'しち', 9: 'く' };
  if (alt[on] && on !== 9) set.add(base.slice(0, -D1[on].length) + alt[on]);
  if (on === 9) set.add(base.slice(0, -D1[9].length) + 'く');
  if (te === 7) [...set].forEach(s => set.add(s.replace('ななじゅう', 'しちじゅう')));
  return set;
}
const toHira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60))
                     .replace(/[\s,、・ー-]/g, '');

// 히라가나 → 한글 발음 (Code.gs와 같은 규칙)
const KS = 'あいうえおかきくけこがぎぐげごさしすせそざじずぜぞたちつてとだぢづでどなにぬねのはひふへほばびぶべぼぱぴぷぺぽまみむめもやゆよらりるれろわを';
const HS = '아이우에오카키쿠케코가기구게고사시스세소자지즈제조타치츠테토다지즈데도나니누네노하히후헤호바비부베보파피푸페포마미무메모야유요라리루레로와오';
const YO = { 'き':'캬큐쿄','ぎ':'갸규교','し':'샤슈쇼','じ':'자주조','ち':'차추초','に':'냐뉴뇨','ひ':'햐휴효','び':'뱌뷰뵤','ぴ':'퍄퓨표','み':'먀뮤묘','り':'랴류료' };
function addFin(s, f) { const c = s.charCodeAt(s.length - 1) - 0xAC00; return (c >= 0 && c <= 11171 && c % 28 === 0) ? s.slice(0, -1) + String.fromCharCode(0xAC00 + c + f) : s; }
function hangul(k) {
  let o = '';
  for (let i = 0; i < k.length; i++) {
    const c = k[i], sm = 'ゃゅょ'.indexOf(k[i + 1]);
    if (YO[c] && sm >= 0) { o += YO[c][sm]; i++; continue; }
    if (c === 'っ') { o = addFin(o, 19); continue; }
    if (c === 'ん') { o = addFin(o, 4); continue; }
    if (c === 'う' && o) {                                   // 장음: じゅう → 주-
      const code = o.charCodeAt(o.length - 1) - 0xAC00, m = Math.floor(code % 588 / 28);
      if (code >= 0 && code % 28 === 0 && [8, 12, 13, 17].includes(m)) { o += '-'; continue; }
    }
    const x = KS.indexOf(c); o += x >= 0 ? HS[x] : c;
  }
  return o;
}

const RANGES = { 1: [1, 10], 2: [11, 99], 3: [100, 999], 4: [1000, 9999], 5: [10000, 99999], 6: [1, 99999] };
let lv = 1, nmode = 'read', numQ = null, seqNext = {}, startT = 0, answered = false;

function pickNum() {

  if (document.getElementById('seq').checked) {
    let n = seqNext[lv] || lo;
    seqNext[lv] = n + 1 > hi ? lo : n + 1;
    // 큰 단계는 순서대로 하면 너무 길어서 단위별로 건너뜀
    if (lv === 4) seqNext[lv] = n + 111 > hi ? lo : n + 111;
    if (lv === 5) seqNext[lv] = n + 1111 > hi ? lo : n + 1111;
    if (lv === 6) return lo + Math.floor(Math.random() * (hi - lo + 1));
    return n;
  }
  return lo + Math.floor(Math.random() * (hi - lo + 1));
}

/* ─── 숫자 말하기 ─── */
let numFailed = false;

/** 인식 결과 → 숫자 ("34567", "3万4567", "三千五百" 등) */
function parseJaNum(s) {
  s = String(s).replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
               .replace(/[,，\s円。、です]/g, '');
  if (/^\d+$/.test(s)) return +s;
  const KD = { '〇': 0, '零': 0, '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9 };
  const U = { '十': 10, '百': 100, '千': 1000 };
  let total = 0, sec = 0, num = null;
  for (const c of s) {
    if (/\d/.test(c)) num = (num || 0) * 10 + +c;
    else if (c in KD) num = (num || 0) * 10 + KD[c];
    else if (c in U) { sec += (num === null ? 1 : num) * U[c]; num = null; }
    else if (c === '万') { total += ((sec + (num || 0)) || 1) * 10000; sec = 0; num = null; }
    else return NaN;
  }
  return total + sec + (num || 0);
}

function numListen() {
  if (answered || nmode !== 'speak') return;
  startListen(alts => {
    const sec = (Date.now() - startT) / 1000;
    const ok = alts.some(a => parseJaNum(a) === numQ || numAccepts(numQ).has(norm(a)));
    const heardNum = alts.map(parseJaNum).find(n => !isNaN(n));
    document.getElementById('nHeard').innerHTML = '인식된 말: <b>' + esc(alts[0] || '') + '</b>' +
      (heardNum !== undefined && !ok ? ` → ${heardNum.toLocaleString()}` : '');
    const out = document.getElementById('numAns');
    if (ok) {
      answered = true;
      if (!numFailed) record(true, sec);
      out.innerHTML = `<div class="ok">⭕ 정답! <span class="timer">(${sec.toFixed(1)}초)</span></div>` + answerHtml(numQ);
      if (spAutoNext) { const q = numQ; setTimeout(() => { if (numQ === q && nmode === 'speak') nextNum(); }, 1400); }
    } else {
      if (!numFailed) { numFailed = true; record(false, sec); }
      out.innerHTML = `<div class="ng">❌ 다시 말해 보세요</div>
        <button class="btn alt" style="font-size:13px" onclick="numListen()">🎤 다시 말하기</button>
        <button class="btn alt" style="font-size:13px" onclick="numOverride()">맞게 말했어요 (인식 오류)</button>`;
    }
  }, document.getElementById('nHeard'), document.getElementById('nMic'));
}

function numOverride() {
  if (numFailed) { st.ng--; st.streak = 0; }
  numFailed = false; record(true, (Date.now() - startT) / 1000); nextNum();
}

function numGiveUp() {
  stopListen();
  if (!answered && !numFailed) { numFailed = true; record(false, 0); }
  document.getElementById('numAns').innerHTML = answerHtml(numQ) +
    `<div><button class="btn alt" style="font-size:13px" onclick="numListen()">🎤 따라 말해 보기</button></div>`;
  speak(numKana(numQ));
}

function record(ok, sec) {
  if (ok) { st.ok++; st.streak++; st.times.push(sec); wrong.delete(numQ); }
  else { st.ng++; st.streak = 0; wrong.add(numQ); }
  document.getElementById('sOk').textContent = st.ok;
  document.getElementById('sNg').textContent = st.ng;
  document.getElementById('sStreak').textContent = st.streak;
  const t = st.times.slice(-20);
  document.getElementById('sAvg').textContent = t.length ? (t.reduce((a, b) => a + b, 0) / t.length).toFixed(1) : '-';
  document.getElementById('wrongCnt').textContent = wrong.size;
}

function retryWrong() {

// 두 문자열 비슷한 정도 (0~1) — 음성 인식 결과 채점용
function similar(a, b) {
  if (!a || !b) return 0;
  const m = a.length, n = b.length, d = Array.from({ length: m + 1 }, (_, i) => [i]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return 1 - d[m][n] / Math.max(m, n);
}
function sayScore(alts, item) {
  const targets = [norm(item.jp), norm(item.kana)];
  return Math.max(0, ...alts.map(norm).flatMap(a => targets.map(t => similar(a, t))));
}
function scoreText(s) {
  return s >= 0.95 ? '<span class="ok">⭕ 완벽해요!</span>' :
         s >= 0.75 ? '<span class="ok">🙆 거의 맞아요!</span>' : '<span class="ng">❌ 다시 해 볼까요?</span>';
}

      html += '</div>';
    });
    view.innerHTML = html;
  } else if (tmode === 'phrases') {
    const cats = [...new Set(TRAVEL.phrases.map(p => p.cat))];
    filterBar(cats, tcat, c => { tcat = c; renderTravel(); });
    renderPhraseList('');
  } else {
    const cats = [...new Set(TRAVEL.phrases.map(p => p.cat))];
    filterBar(cats, tcat, c => { tcat = c; renderTravel(); });
    nextTq();
  }
}

function renderPhraseList(q) {
  q = (q || '').trim().toLowerCase();
  let html = '<div class="tlist">';
  let n = 0;
  TRAVEL.phrases.forEach((p, i) => {
    if (tcat !== '전체' && p.cat !== tcat) return;
    if (q && ![p.jp, p.kana, p.mean, p.ko].some(x => x.toLowerCase().includes(q))) return;
    n++;
    html += `<div class="titem">
      <div class="tm"><span class="badge">${i + 1}. ${esc(p.cat)}</span> <b>${esc(p.mean)}</b></div>
      <div class="tj" style="margin-top:4px">${esc(p.jp)} ${spk(p.jp)}</div>
      <div class="tk">${esc(p.kana)}</div>
      <div class="th">${esc(p.ko)}</div>
      <div class="tacts">
        <button class="sbtn" onclick="practice(this, ${i}, 'phrase')">🎤 따라 말하기</button>
        <button class="sbtn" onclick="showBig(${i}, 'phrase')">🔍 크게 보여주기</button>
      </div>
      <div class="say"></div>
    </div>`;
  });
  document.getElementById('tview').innerHTML = `<div class="count" style="margin-bottom:8px">${n}개 표현</div>` + html + '</div>';
}

/* ─── 표현 말하기 퀴즈: 한국어 보고 일본어로 말하기 ─── */
function nextTq() {
  stopListen();
  const pool = TRAVEL.phrases.map((p, i) => i).filter(i => tcat === '전체' || TRAVEL.phrases[i].cat === tcat);
  const idx = pool[Math.floor(Math.random() * pool.length)];
  const p = TRAVEL.phrases[idx];
  tq = { idx, start: Date.now(), done: false, failed: false };
  document.getElementById('tview').innerHTML = `<div class="quiz">
      <div class="stats"><span>맞힘 <b>${tqSt.ok}</b></span><span>틀림 <b>${tqSt.ng}</b></span><span>연속 <b>${tqSt.streak}</b></span></div>
      <span class="badge">${esc(p.cat)}</span>
      <div class="koq" style="margin-top:8px">${esc(p.mean)}</div>
      <div class="ask">👉 일본어로 말해 보세요</div>
      <div style="margin:14px 0 6px"><button class="mic" id="tqMic" onclick="tqListen()">🎤</button></div>
      <div class="heard" id="tqHeard">🎤를 누르고 말하세요 (스페이스바도 가능)</div>
      <div id="tqAns" class="ans" style="font-size:22px"></div>
      <button class="btn alt" onclick="tqReveal()">정답 보기</button>
      <button class="btn alt" onclick="nextTq()">다음 ▶</button>
      <div class="opts">
        <label><input type="checkbox" ${spAutoNext ? 'checked' : ''} onchange="spAutoNext=this.checked"> 정답이면 자동으로 다음</label> ·
        <label><input type="checkbox" ${spAutoMic ? 'checked' : ''} onchange="spAutoMic=this.checked"> 문제가 나오면 바로 듣기</label>
      </div>
    </div>`;
  if (spAutoMic && micReady) setTimeout(() => { if (tq && tq.idx === idx && !tq.done) tqListen(); }, 400);
}

function tqAnswerHtml(p) {
  return `${esc(p.jp)} ${spk(p.jp)}<br><span style="font-size:15px;color:var(--sub)">${esc(p.kana)} · <span class="ko">${esc(p.ko)}</span></span>`;
}

function tqListen() {
  if (!tq || tq.done) return;
  const p = TRAVEL.phrases[tq.idx];
  startListen(alts => {
    const s = sayScore(alts, p), sec = ((Date.now() - tq.start) / 1000).toFixed(1);
    document.getElementById('tqHeard').innerHTML = '인식된 말: <b>' + esc(alts[0] || '') + '</b>';
    const out = document.getElementById('tqAns');
    if (s >= 0.75) {
      tq.done = true;
      if (!tq.failed) { tqSt.ok++; tqSt.streak++; }
      out.innerHTML = `<div>${scoreText(s)} <span class="timer">${sec}초</span></div>` + tqAnswerHtml(p);
      if (spAutoNext) { const cur = tq; setTimeout(() => { if (tq === cur && tmode === 'quiz') nextTq(); }, 1800); }
    } else {
      if (!tq.failed) { tq.failed = true; tqSt.ng++; tqSt.streak = 0; }
      out.innerHTML = `<div class="ng">❌ 다시 말해 보세요</div>
        <button class="btn alt" style="font-size:13px" onclick="tqListen()">🎤 다시 말하기</button>
        <button class="btn alt" style="font-size:13px" onclick="tqOverride()">맞게 말했어요 (인식 오류)</button>`;
    }
  }, document.getElementById('tqHeard'), document.getElementById('tqMic'));
}
function tqOverride() { if (tq.failed) tqSt.ng--; tq.failed = false; tqSt.ok++; tqSt.streak++; nextTq(); }
function tqReveal() {
  stopListen();
  if (!tq.done && !tq.failed) { tq.failed = true; tqSt.ng++; tqSt.streak = 0; }
  const p = TRAVEL.phrases[tq.idx];
  document.getElementById('tqAns').innerHTML = tqAnswerHtml(p) +
    `<div><button class="btn alt" style="font-size:13px" onclick="tqListen()">🎤 따라 말해 보기</button></div>`;
  speak(p.jp);
}

if (!IN_GAS) document.getElementById('view').innerHTML = NOT_GAS_MSG;
else google.script.run
  .withSuccessHandler(data => { VERBS = data; render(); })
  .withFailureHandler(err => { document.getElementById('view').innerHTML = '<div class="loading">오류: ' + esc(err.message) + '</div>'; })
  .getVerbs();
</script>
<button id="installBtn" class="hidden" style="position:fixed;right:16px;bottom:16px;z-index:60;background:#b3364a;color:#fff;border:none;border-radius:24px;padding:12px 18px;font-size:15px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer">📲 앱으로 설치</button>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt = e;
  document.getElementById('installBtn').classList.remove('hidden');
});
document.getElementById('installBtn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null;
  document.getElementById('installBtn').classList.add('hidden');
});
</script>
</body>
